name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync

      - name: Vérifier le style (ruff)
        run: uv run ruff check .

      - name: Lancer les tests
        run: uv run pytest